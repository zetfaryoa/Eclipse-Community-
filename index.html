<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éclipse Community</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#090909;
    color:white;
    text-align:center;
    overflow-x:hidden;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#090909,#18102f);
}

h1{
    font-size:3rem;
    color:#a855f7;
    text-shadow:0 0 20px #a855f7;
    animation:glow 2s infinite alternate;
}

p{
    margin-top:20px;
    font-size:1.2rem;
    color:#ddd;
}

.btn{
    margin-top:30px;
    padding:15px 35px;
    background:#a855f7;
    color:white;
    text-decoration:none;
    border-radius:15px;
    font-size:18px;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #a855f7;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #a855f7;
    }
    to{
        text-shadow:0 0 30px #a855f7;
    }
}
</style>
</head>

<body>

<div class="hero">
    <h1>🌙 Éclipse Community ✨</h1>
    <p>Robux • Discord Nitro • V-Bucks • Boost • Décorations Discord</p>

    <a class="btn" href="https://discord.gg/V6VJtYrdzu">
        Rejoindre le Discord
    </a>
</div>

</body>
</html>
